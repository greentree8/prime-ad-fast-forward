<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 300px; margin: 12px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 6px 0; }
  textarea { width: 100%; height: 110px; box-sizing: border-box; font: 12px ui-monospace, monospace; }
  .hint { color: #666; font-size: 11px; margin: 2px 0 8px; }
  fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 8px 0; }
  #status { color: #2a7; height: 14px; }
</style>
</head>
<body>
  <h1>⏩ Prime Ad Fast-Forward</h1>
  <label><input type="checkbox" id="enabled"> Enabled</label>

  <fieldset>
    <legend>Auto fast-forward</legend>
    <label><input type="radio" name="mode" value="keywords"> Ads matching my keywords</label>
    <label><input type="radio" name="mode" value="all"> All ads</label>
    <label><input type="radio" name="mode" value="manual"> None (hotkey only)</label>
  </fieldset>

  <label>Keywords / advertisers (one per line)</label>
  <textarea id="keywords" placeholder="e.g.&#10;brand name&#10;product&#10;phrase"></textarea>
  <div class="hint">Matched against on-screen ad text and captions. Turn on subtitles in Prime for best results.</div>

  <label><input type="checkbox" id="mute"> Mute while fast-forwarding</label>
  <label>Speed: <select id="speed">
    <option>4</option><option>8</option><option>16</option>
  </select>×</label>

  <div class="hint"><b>Hotkey:</b> Alt/Option + S during an ad to fast-forward the rest of that break.</div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
